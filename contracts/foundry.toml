[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech/terigon"
xlayer_mainnet = "https://rpc.xlayer.tech"
