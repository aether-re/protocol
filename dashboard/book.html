<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aether Re: how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* drawn from the mark: warm paper, navy ink, sage */
  --ground:#F5F2EC;
  --surface:#EFEBE3;
  --surface-2:#E7E2D8;
  --rule:#DAD5CA;
  --rule-strong:#C2BBAD;
  --text:#22333F;
  --muted:#6E7D88;
  --dim:#9AA5AD;

  --safe:#5E8F82;      /* sage, from the mark */
  --attached:#B8893C;
  --eroding:#C0703F;
  --exhausted:#A8524C;
  --agent:#3E6B7E;

  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:"Instrument Serif",Georgia,serif;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--mono);font-size:13px;font-weight:400;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--agent);text-decoration:none;border-bottom:1px solid rgba(62,107,126,.35)}
a:hover,a:focus-visible{border-bottom-color:var(--agent)}
:focus-visible{outline:2px solid var(--agent);outline-offset:2px}

.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 24px;
  box-sizing:border-box}

/* ---- masthead ---- */
.masthead{border-bottom:1px solid var(--rule-strong);background:var(--ground);
  position:sticky;top:0;z-index:20}
.masthead .wrap{display:flex;align-items:baseline;gap:20px;
  flex-wrap:wrap;padding-top:20px;padding-bottom:16px}
.wordmark{font-family:var(--sans);font-weight:600;font-size:15px;
  letter-spacing:.24em;text-transform:uppercase;margin:0}
a.wordmark{color:var(--text);border:none}
.wordmark span{color:var(--muted);font-weight:400;letter-spacing:.14em}
.chain{color:var(--dim);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.epoch-badge{margin-left:auto;display:flex;align-items:center;gap:9px;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--safe);
  box-shadow:0 0 0 0 rgba(94,143,130,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(94,143,130,0)}
  100%{box-shadow:0 0 0 0 rgba(94,143,130,0)}}

/* ---- simulation disclosure ---- */
.disclosure{background:var(--surface);border-bottom:1px solid var(--rule);
  font-size:11.5px;color:var(--muted)}
.disclosure .wrap{padding:11px 24px}
.lede,.disclosure .wrap{overflow-wrap:break-word;word-wrap:break-word}
.disclosure strong{color:var(--text);font-weight:500}

/* ---- sections ---- */
section{padding:56px 0;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px;font-family:var(--sans);font-weight:500}
h2{font-family:var(--display);font-weight:400;font-size:34px;
  letter-spacing:-.01em;margin:0 0 8px;line-height:1.1}
.lede{color:var(--muted);margin:0 0 30px;max-width:74ch;font-size:12.5px}
.lede b{color:var(--text);font-weight:500}
.enter{margin-left:0;position:relative}
.enter-btn{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;background:var(--text);color:var(--ground);
  border:1px solid var(--text);padding:9px 16px;border-radius:2px;cursor:pointer}
.enter-btn:hover{background:#2C4150;border-color:#2C4150}
.enter-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:168px;
  background:var(--ground);border:1px solid var(--rule-strong);padding:6px 0;z-index:30}
.enter-menu a{display:block;padding:10px 16px;border:none;color:var(--text);
  font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.enter-menu a:hover{background:var(--surface)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.tower-sec{display:flex;flex-direction:column}
.cta{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;
  padding:11px 20px;border:1px solid var(--text);background:var(--text);color:var(--ground);
  border-radius:2px;white-space:nowrap;margin-bottom:6px}
.cta:hover{background:#2C4150;border-color:#2C4150;color:var(--ground)}
button.act,button.ghost{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.06em;
  padding:11px 20px;border:1px solid var(--text);background:var(--text);color:var(--ground);
  border-radius:2px;cursor:pointer}
button.ghost{background:none;color:var(--text);border-color:var(--rule-strong)}
button.ghost:hover{background:var(--surface-2);border-color:var(--text)}
button.act:hover{background:#2C4150;border-color:#2C4150;color:var(--ground)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 0}

/* ---- hero / this epoch ---- */
.hero{padding-top:48px}
.hero h2{font-size:40px;max-width:22ch}
.tagline{color:var(--muted);margin:0 0 28px;max-width:68ch;font-size:13px}
.decision{border:1px solid var(--rule-strong);background:var(--surface);padding:22px 24px;margin:0 0 28px}
.decision h3{font-family:var(--display);font-size:24px;font-weight:400;margin:0 0 10px;letter-spacing:-.01em}
.decision .memo{color:var(--muted);margin:0 0 16px;max-width:78ch;font-size:12.5px}
.decision .memo b{color:var(--text);font-weight:500}
.whys{display:flex;flex-wrap:wrap;gap:8px}
.why{border:1px solid var(--rule);background:var(--ground);padding:7px 10px;font-size:11px;color:var(--muted)}
.why em{font-style:normal;color:var(--text);font-family:var(--sans);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;margin-right:8px}
.why.took em{color:var(--safe)} .why.refused em{color:var(--exhausted)}
.source{font-size:10px;color:var(--dim);margin:12px 0 0}

/* ---- verify / stress panels ---- */
.panel-run{border:1px solid var(--rule);background:var(--surface);padding:20px 22px;margin-top:16px}
.panel-run h3{font-family:var(--display);font-size:22px;font-weight:400;margin:0 0 6px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.check:last-child{border-bottom:none}
.mark{flex:0 0 52px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-family:var(--sans);font-weight:500;padding-top:2px}
.mark.pass{color:var(--safe)} .mark.fail{color:var(--exhausted)} .mark.sealed{color:var(--attached)}
.check p{margin:0;color:var(--text)}
.check .detail{color:var(--muted);font-size:11px;margin-top:4px;word-break:break-word}
.stress-grid{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
  grid-template-columns:repeat(4,1fr);margin:16px 0}
.stress-grid div{background:var(--ground);padding:12px 14px}
.stress-grid span{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:6px;font-family:var(--sans);font-weight:500}
.stress-grid b{font-family:var(--display);font-size:22px;font-weight:400}
.roadmap{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:900px){.roadmap{grid-template-columns:repeat(4,1fr)}}
.step-card{border:1px solid var(--rule);background:var(--surface);padding:16px}
.step-card .num{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:8px}
.step-card h3{font-family:var(--display);font-size:18px;font-weight:400;margin:0 0 6px}
.step-card p{margin:0;color:var(--muted);font-size:11.5px}
.step-card.now{border-color:var(--agent)}

/* tablet */
@media(min-width:641px) and (max-width:1024px){
  .wrap{padding:0 20px}
  section{padding:40px 0}
  h2{font-size:29px}
  .hero h2{font-size:34px}
  .decision{padding:20px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stress-grid{grid-template-columns:repeat(2,1fr)}
  .stat{padding:16px 18px}
  .stat dd{font-size:29px}
}

@media(max-width:640px){
  html,body{max-width:100vw;overflow-x:hidden}
  .wrap{padding:0 16px;max-width:100vw}
  .masthead .wrap,.disclosure .wrap{padding-left:20px;padding-right:20px}
  section{padding:34px 0}
  h2{font-size:26px}
  .stat dd{font-size:26px}
  .stats{grid-template-columns:1fr 1fr}
  .stress-grid{grid-template-columns:1fr 1fr}
  .epoch-badge{display:none}
  .tower-sec .sec-head{display:contents}
  .tower-title{order:1}
  .tower-sec .lede{order:2}
  .tower-wrap{order:3}
  .legend{order:4}
  .tower-sec .cta{order:5;width:100%;text-align:center;margin:22px 0 0}
  .masthead .wrap{
    display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;
    gap:12px;padding:16px 20px}
  .wordmark{white-space:nowrap;flex:0 0 auto}
  .enter{margin:0;flex:0 0 auto}
  .cal-sum{grid-template-columns:1fr}
  table{font-size:11.5px}
  th,td{padding-right:8px}
  .panel{padding:16px}
  .hero h2{font-size:28px}
  .decision{padding:18px 16px}
  .actions{flex-direction:column}
  .actions button{width:100%}
}

/* ---- tower ---- */
.tower-wrap{width:100%;max-width:100%;min-width:0;padding-bottom:8px}
.tower{display:block;width:100%;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;
  font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:7px;
  vertical-align:baseline;border-radius:1px}

/* ---- stats ---- */
.stats{display:grid;gap:1px;background:var(--rule);
  grid-template-columns:repeat(4,1fr);
  border:1px solid var(--rule)}
.stat{background:var(--ground);padding:20px 22px}
.stat dt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);margin:0 0 10px;font-family:var(--sans);font-weight:500}
.stat dd{margin:0;font-family:var(--display);font-weight:400;
  font-size:34px;letter-spacing:-.01em;line-height:1}
.stat .sub{font-family:var(--mono);font-size:11px;font-weight:400;
  color:var(--muted);letter-spacing:0;margin-top:9px}
.pos{color:var(--safe)} .neg{color:var(--exhausted)}

/* ---- charts ---- */
.grid-2{display:grid;gap:30px;grid-template-columns:1fr}
@media(min-width:900px){.grid-2{grid-template-columns:1.35fr 1fr}}
.panel{border:1px solid var(--rule);background:var(--surface);padding:22px}
.panel h3{font-family:var(--display);font-size:21px;font-weight:400;
  margin:0 0 5px;letter-spacing:-.01em}
.panel p.note{color:var(--muted);font-size:11.5px;margin:0 0 16px}
.panel p.note b{color:var(--text);font-weight:500}
svg.chart{display:block;width:100%;height:auto}

/* ---- tables ---- */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;color:var(--dim);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;padding:0 12px 10px 0;
  border-bottom:1px solid var(--rule-strong);white-space:nowrap;
  font-family:var(--sans)}
td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);
  vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border:1px solid currentColor;border-radius:2px;
  font-family:var(--sans)}
.t-active{color:var(--safe)} .t-exhausted{color:var(--exhausted)}
.t-expired{color:var(--dim)}
.scroll{max-height:360px;overflow-y:auto;overflow-x:auto;width:100%;max-width:100%;min-width:0}
.tablebox{overflow-x:auto;width:100%;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch}
table{min-width:560px}

.cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:18px}
.cal-sum div{background:var(--ground);padding:12px 14px}
.cal-sum span{display:block;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:7px;font-family:var(--sans);font-weight:500}
.cal-sum b{font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:-.01em}

/* ---- verification ---- */
.verify{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:760px){.verify{grid-template-columns:1fr 1fr}}
.hashbox{border:1px solid var(--rule);padding:16px;background:var(--surface)}
.hashbox dt{font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px;font-family:var(--sans);font-weight:500}
.hashbox dd{margin:0;font-size:11px;word-break:break-all;color:var(--text)}
pre{background:var(--surface);border:1px solid var(--rule);padding:16px;
  overflow-x:auto;font-size:11.5px;margin:0;color:var(--muted);line-height:1.7}
pre b{color:var(--text);font-weight:500}

footer{padding:36px 0 72px;color:var(--dim);font-size:11px}
.err{color:var(--muted);padding:70px 0;font-size:13px}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="./" style="border:none">Aether Re</a>
    <span class="epoch-badge"><span class="pulse"></span><span id="epochBadge">–</span></span>
    <div class="enter">
      <button type="button" class="enter-btn" aria-expanded="false" aria-haspopup="true">Enter app</button>
      <div class="enter-menu" hidden>
        <a href="deposit.html">Deposit</a>
        <a href="position.html">Position</a>
      </div>
    </div>
  </div>
</header>

<main id="app">
  <div class="wrap err" id="boot">Loading chain data…</div>
</main>

<footer><div class="wrap">
  Aether Re · <span id="chainFoot">X Layer testnet</span> · data indexed from chain events
  · <span id="stamp"></span>
</div></footer>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const fmt = (n,d=0)=>n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (n,d=1)=>(n*100).toFixed(d)+"%";
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const short = h=>h.slice(0,10)+"…"+h.slice(-8);

const PERILS=[{id:0,name:"FL_WIND",label:"Florida wind",region:"US Southeast"},
              {id:1,name:"GULF_WIND",label:"Gulf wind",region:"US Southeast"},
              {id:2,name:"EU_WIND",label:"Europe wind",region:"Europe"}];

function stateColor(l){
  if(l.state==="exhausted") return "var(--exhausted)";
  if(l.state==="expired")   return "var(--dim)";
  return l.erosion>0.02 ? "var(--eroding)" : "var(--safe)";
}

/* ---------- signature: the tower ---------- */
/*
   One coordinate system. Every x is derived from the column origin and every
   y from the loss scale; nothing is placed by eye. Strokes land on half-pixel
   centres so 1px rules render crisp rather than as 2px grey smears, and rects
   land on whole pixels so their edges stay hard.

   Markers are NOT snapped to tower boundaries. A catastrophe sits at its
   actual subject loss; moving it onto the nearest attachment point would
   misstate the data. What is uniform is every marker's length, weight and
   distance from the bar.
*/
const G = {
  W:1040, H:486,
  padL:78, padR:152, padT:44, padB:96,
  barW:148,          // identical for all three columns
  stubLen:24,        // every marker stub, same length
  stubGap:7,         // bar edge to stub, same on both sides
  trancheGap:2,      // separation between contiguous tranches
  lo:240, hi:4600,   // loss axis
};
const gx = v => Math.round(v);            // rect edges
const gs = v => Math.round(v) + 0.5;      // stroke centres

function tower(d){
  const {W,H,padL,padR,padT,padB,barW,stubLen,stubGap,trancheGap,lo,hi} = G;
  const plotH = H - padT - padB;
  const colW  = (W - padL - padR) / PERILS.length;
  const y  = v => padT + (Math.log(hi)-Math.log(v))/(Math.log(hi)-Math.log(lo))*plotH;
  const clampY = v => Math.max(padT+14, Math.min(padT+plotH, y(v)));
  const gutterY = gx(H - padB + 28);

  // shared x offsets, identical in every column
  const OX = {
    bar:      0,
    barEnd:   barW,
    stubL0:  -stubGap - stubLen,
    stubL1:  -stubGap,
    stubR0:   barW + stubGap,
    stubR1:   barW + stubGap + stubLen,
    label:    barW + stubGap + stubLen + 14,
    attachX: -stubGap - stubLen - 6,
  };

  let s = `<svg class="tower" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Reinsurance tower: nine layers by attachment and exhaustion, with catastrophe events">`;
  s += `<defs><pattern id="eroded" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="var(--exhausted)" fill-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--exhausted)" stroke-opacity="0.45" stroke-width="2"/>
    </pattern></defs>`;

  // ---- loss grid, spanning the full plot ----
  const gridL = gx(padL - 10), gridR = gx(W - padR + 10);
  [250,500,1000,2000,4000].forEach(v=>{
    const yy = gs(y(v));
    s += `<line x1="${gridL}" y1="${yy}" x2="${gridR}" y2="${yy}" stroke="var(--rule)" stroke-width="1"/>`;
    s += `<text x="${gridL-8}" y="${yy+3.5}" text-anchor="end" font-size="10" fill="var(--dim)">${v>=1000?(v/1000)+"k":v}</text>`;
  });
  s += `<text x="${gridL-8}" y="${gx(padT)-16}" text-anchor="end" font-size="9" fill="var(--dim)" letter-spacing="1">$M</text>`;
  s += `<line x1="${gridL}" y1="${gs(gutterY-16)}" x2="${gridR}" y2="${gs(gutterY-16)}" stroke="var(--rule)" stroke-dasharray="2 4"/>`;
  s += `<text x="${gridL-8}" y="${gutterY+4}" text-anchor="end" font-size="9" fill="var(--dim)">&lt;${lo}</text>`;

  PERILS.forEach((p,i)=>{
    const x0 = gx(padL + colW*i + (colW-barW)/2);
    const X  = k => x0 + OX[k];
    const layers = d.layers.filter(l=>l.peril===p.id).sort((a,b)=>a.tranche-b.tranche);
    const cats   = d.catastrophes.filter(c=>c.peril===p.id);

    // ---- markers: collapse events landing on the same pixel row ----
    let below = 0;
    const offscale = [], rows = new Map();
    cats.forEach(c=>{
      const breached = layers.some(l=>c.subjectLoss > l.attachment);
      if(!breached && c.subjectLoss < lo){ below++; return; }
      if(c.subjectLoss > hi){ offscale.push(c); return; }
      const key = gx(clampY(c.subjectLoss));
      const row = rows.get(key) || {breached:false, items:[]};
      row.breached = row.breached || breached;
      row.items.push(c);
      rows.set(key, row);
    });

    [...rows.entries()].forEach(([yy,row])=>{
      const col = row.breached ? "var(--exhausted)" : "var(--muted)";
      const w   = row.breached ? 1.4 : 1;
      const o   = row.breached ? 0.8 : 0.34;
      const dash= row.breached ? "" : ' stroke-dasharray="3 3"';
      const tip = row.items.map(c=>`epoch ${c.epoch}: ${fmt(c.subjectLoss)}M`).join(" · ");
      s += `<g stroke="${col}" stroke-width="${w}" stroke-opacity="${o}"${dash}>
              <line x1="${X('stubL0')}" y1="${gs(yy)}" x2="${X('stubL1')}" y2="${gs(yy)}"/>
              <line x1="${X('stubR0')}" y1="${gs(yy)}" x2="${X('stubR1')}" y2="${gs(yy)}"/>
              <title>${tip}</title></g>`;
    });

    // ---- layers ----
    layers.forEach(l=>{
      const yTop = gx(y(l.exhaustion)) + trancheGap;
      const yBot = gx(y(l.attachment));
      const h = Math.max(3, yBot - yTop);
      const col = stateColor(l);
      const taken = Math.max(0, Math.min(1, (l.linePercent||0)/100));

      s += `<rect x="${gs(x0)}" y="${gs(yTop)}" width="${barW-1}" height="${h-1}"
              fill="var(--ground)" stroke="var(--rule-strong)" stroke-width="1" stroke-dasharray="3 3"/>`;
      if(taken > 0.001){
        const tw = gx(barW * taken);
        s += `<rect x="${gs(x0)}" y="${gs(yTop)}" width="${tw-1}" height="${h-1}"
                fill="${col}" fill-opacity="${l.state==='exhausted'?0.18:0.5}"
                stroke="${col}" stroke-opacity="0.85" stroke-width="1"/>`;
        if(l.erosion > 0.01){
          const eh = gx(h * Math.min(1,l.erosion));
          s += `<rect x="${gx(x0)}" y="${gx(yBot-eh)}" width="${tw}" height="${eh}" fill="url(#eroded)"/>`;
        }
      }
      s += `<title>${l.name} · attach ${fmt(l.attachment)} exhaust ${fmt(l.exhaustion)} · line ${l.linePercent.toFixed(1)}% · ${l.state}${l.erosion>0.01?' · '+pct(l.erosion,0)+' eroded':''}</title>`;
    });

    // ---- labels, on the same two x columns in every group ----
    layers.forEach(l=>{
      const yTop = gx(y(l.exhaustion)) + trancheGap;
      const yBot = gx(y(l.attachment));
      const h = yBot - yTop;
      if(h <= 18) return;
      const col = stateColor(l);
      const taken = Math.max(0, Math.min(1, (l.linePercent||0)/100));
      const ty = gx(yTop + h/2) + 3;
      s += `<text x="${x0+9}" y="${ty}" font-size="9.5" letter-spacing="0.9"
              fill="var(--text)" fill-opacity="0.8">${l.trancheName.toUpperCase()}</text>`;
      s += `<text x="${X('label')}" y="${ty}" font-size="9.5"
              fill="${taken>0.001?col:'var(--dim)'}">${taken>0.001?l.linePercent.toFixed(0)+'%':'–'}</text>`;
    });

    if(layers.length){
      s += `<text x="${X('attachX')}" y="${gx(y(layers[0].attachment))+12}" text-anchor="end"
              font-size="8.5" fill="var(--dim)">${fmt(layers[0].attachment)}</text>`;
    }

    // ---- off-scale events, one row each, evenly pitched ----
    offscale.sort((a,b)=>b.subjectLoss-a.subjectLoss).forEach((c,k)=>{
      const yy = gs(padT + 14 + k*16);
      s += `<line x1="${X('stubL0')}" y1="${yy}" x2="${X('stubR1')}" y2="${yy}"
              stroke="var(--exhausted)" stroke-width="1.4" stroke-opacity="0.8"/>`;
      s += `<path d="M${X('stubL0')-4},${yy+4} L${X('stubL0')-10},${yy} L${X('stubL0')-4},${yy-4} Z"
              fill="var(--exhausted)"/>`;
      s += `<text x="${X('label')}" y="${yy+3.5}" font-size="9.5" fill="var(--exhausted)"
              >${fmt(c.subjectLoss)}<title>epoch ${c.epoch}, above axis</title></text>`;
    });

    // ---- gutter ----
    if(below){
      const dots = Math.min(below, 24);
      const pitch = (barW-10)/Math.max(1,dots-1);
      for(let k=0;k<dots;k++){
        s += `<circle cx="${gx(x0+5+k*pitch)}" cy="${gutterY}" r="2.2" fill="var(--muted)" fill-opacity="0.55"/>`;
      }
      s += `<text x="${X('label')}" y="${gutterY+3.5}" font-size="9" fill="var(--dim)">${below} below</text>`;
    }

    const cx = gx(x0 + barW/2);
    s += `<text x="${cx}" y="${H-32}" text-anchor="middle" font-size="11.5" fill="var(--text)" font-weight="500">${p.label}</text>`;
    s += `<text x="${cx}" y="${H-16}" text-anchor="middle" font-size="9" fill="var(--dim)" letter-spacing="0.7">${p.region.toUpperCase()}</text>`;
  });

  return s + "</svg>";
}

/* ---------- NAV ---------- */
function navChart(d){
  const W=620,H=250,padL=56,padR=12,padT=14,padB=28;
  const e=d.epochs; if(!e.length) return "<p class='note'>No epochs settled yet.</p>";
  const navs=e.map(p=>p.nav), lo=Math.min(...navs,d.vault.seedCapital)*0.97,
        hi=Math.max(...navs,d.vault.seedCapital)*1.03;
  const X=i=>padL+i/Math.max(1,e.length-1)*(W-padL-padR);
  const Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);

  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net asset value by epoch">`;
  for(let k=0;k<=4;k++){
    const v=lo+(hi-lo)*k/4;
    s+=`<line x1="${padL}" y1="${Y(v)}" x2="${W-padR}" y2="${Y(v)}" stroke="var(--rule)" stroke-width="1"/>`;
    s+=`<text x="${padL-8}" y="${Y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--dim)">${(v/1e6).toFixed(2)}M</text>`;
  }
  // seed capital reference
  s+=`<line x1="${padL}" y1="${Y(d.vault.seedCapital)}" x2="${W-padR}" y2="${Y(d.vault.seedCapital)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`;
  s+=`<text x="${padL+6}" y="${Y(d.vault.seedCapital)-6}" font-size="9" fill="var(--muted)">seed capital</text>`;

  // loss epochs as vertical marks
  e.forEach((p,i)=>{ if(p.losses>0)
    s+=`<line x1="${X(i)}" y1="${padT}" x2="${X(i)}" y2="${H-padB}" stroke="var(--exhausted)" stroke-opacity="0.35" stroke-width="1"/>`;});

  const path=e.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.nav).toFixed(1)}`).join("");
  s+=`<path d="${path}L${X(e.length-1)},${H-padB}L${X(0)},${H-padB}Z" fill="var(--safe)" fill-opacity="0.11"/>`;
  s+=`<path d="${path}" fill="none" stroke="var(--safe)" stroke-width="1.8" stroke-linejoin="round"/>`;
  s+=`<text x="${padL}" y="${H-8}" font-size="9.5" fill="var(--dim)">epoch ${e[0].epoch}</text>`;
  s+=`<text x="${W-padR}" y="${H-8}" text-anchor="end" font-size="9.5" fill="var(--dim)">epoch ${e[e.length-1].epoch}</text>`;
  return s+"</svg>";
}

/* ---------- calibration ---------- */
function calibration(d){
  const ev=d.forecasts.filter(f=>f.resolved && f.epoch%4===2);
  if(!ev.length) return `<p class="note">No event quarters resolved yet. Forecasts for
    non-event quarters are structurally zero and carry no signal.</p>`;

  const W=440,H=250,padL=46,padR=14,padT=18,padB=44;
  const plotH=H-padT-padB, plotW=W-padL-padR;
  const mx=Math.max(120,...ev.map(f=>Math.max(f.predictedBps,f.realizedBps)))*1.15;
  const X=i=>padL+(ev.length===1?plotW/2:i/(ev.length-1)*plotW);
  const Y=v=>padT+plotH-(v/mx)*plotH;
  const bw=Math.max(4,Math.min(16,plotW/ev.length*0.5));

  const sumP=ev.reduce((a,f)=>a+f.predictedBps,0);
  const sumR=ev.reduce((a,f)=>a+f.realizedBps,0);

  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Predicted and realised loss for each event quarter">`;
  for(let k=0;k<=3;k++){
    const v=mx*k/3;
    s+=`<line x1="${padL}" y1="${Y(v)}" x2="${W-padR}" y2="${Y(v)}" stroke="var(--rule)"/>`;
    s+=`<text x="${padL-7}" y="${Y(v)+3.5}" text-anchor="end" font-size="9" fill="var(--dim)">${(v/100).toFixed(1)}%</text>`;
  }
  // realised, as bars
  ev.forEach((f,i)=>{
    const h=Math.max(f.realizedBps>0?2:0,(f.realizedBps/mx)*plotH);
    if(h>0) s+=`<rect x="${X(i)-bw/2}" y="${Y(f.realizedBps)}" width="${bw}" height="${h}"
      fill="var(--exhausted)" fill-opacity="0.85"><title>epoch ${f.epoch}: realised ${(f.realizedBps/100).toFixed(2)}%</title></rect>`;
  });
  // predicted, as a line with markers
  const path=ev.map((f,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(f.predictedBps).toFixed(1)}`).join("");
  s+=`<path d="${path}" fill="none" stroke="var(--agent)" stroke-width="1.6" stroke-linejoin="round"/>`;
  ev.forEach((f,i)=>{
    s+=`<circle cx="${X(i)}" cy="${Y(f.predictedBps)}" r="3" fill="var(--ground)"
      stroke="var(--agent)" stroke-width="1.4"><title>epoch ${f.epoch}: predicted ${(f.predictedBps/100).toFixed(2)}%</title></circle>`;
  });
  s+=`<line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="var(--rule)"/>`;
  s+=`<text x="${padL}" y="${H-24}" font-size="9" fill="var(--dim)">epoch ${ev[0].epoch}</text>`;
  s+=`<text x="${W-padR}" y="${H-24}" text-anchor="end" font-size="9" fill="var(--dim)">epoch ${ev[ev.length-1].epoch}</text>`;
  s+=`<text x="${padL}" y="${H-8}" font-size="9.5" fill="var(--agent)">&#9679; predicted</text>`;
  s+=`<text x="${padL+92}" y="${H-8}" font-size="9.5" fill="var(--exhausted)">&#9632; realised</text>`;
  s+="</svg>";

  // Losses that landed before AgentLog was deployed are outside the scored
  // window. They are disclosed rather than backfilled: writing a forecast
  // after seeing the outcome would destroy the point of publishing one first.
  const first=ev[0].epoch;
  const priorLoss=d.epochs.filter(e=>e.epoch<first && e.losses>0);
  const priorTotal=priorLoss.reduce((a,e)=>a+e.losses,0);

  s+=`<div class="cal-sum">
    <div><span>Cumulative predicted</span><b>${(sumP/100).toFixed(2)}%</b></div>
    <div><span>Cumulative realised</span><b>${(sumR/100).toFixed(2)}%</b></div>
    <div><span>Event quarters scored</span><b>${ev.length}</b></div>
  </div>
  <p class="note" style="margin:12px 0 0"><b>Scoring runs from epoch ${first}</b>, when the forecast
    contract was deployed.${priorLoss.length?` The run's ${priorLoss.length===1?"only":priorLoss.length}
    earlier loss${priorLoss.length===1?"":"es"}, ${fmt(priorTotal)} USDC at epoch
    ${priorLoss.map(e=>e.epoch).join(", ")}, fell outside this window and are excluded. They are not
    backfilled: a forecast written after the outcome is known proves nothing.`:""}</p>
  <p class="note" style="margin:8px 0 0">Catastrophe loss is zero in most years and very large in a few,
    so a well-calibrated agent looks wrong most of the time. The test is whether the two cumulative
    figures converge over many event quarters, not whether any single quarter matches, and
    ${ev.length} quarter${ev.length===1?"":"s"} is far too few to judge that.</p>`;
  return s;
}

const NICE={FL_WIND_JUNIOR:"Florida junior",FL_WIND_MEZZ:"Florida mezzanine",
  FL_WIND_SENIOR:"Florida senior",GULF_WIND_JUNIOR:"Gulf junior",
  GULF_WIND_MEZZ:"Gulf mezzanine",GULF_WIND_SENIOR:"Gulf senior",
  EU_WIND_JUNIOR:"Europe junior",EU_WIND_MEZZ:"Europe mezzanine",
  EU_WIND_SENIOR:"Europe senior"};
const nice=n=>NICE[n]||n;

function hero(d){
  const v=d.vault;
  const b=d.brief||{headline:"The agent is on risk.",body:"",taken:[],refused:[],actions:[],source:"rule",constraints:{}};
  const evQ=(d.forecasts||[]).filter(f=>f.resolved && f.epoch%4===2);
  const pred=v.predBps!=null?v.predBps:evQ.reduce((a,f)=>a+f.predictedBps,0);
  const real=v.realBps!=null?v.realBps:evQ.reduce((a,f)=>a+(f.realizedBps||0),0);
  const dd=v.maxDrawdown!=null?v.maxDrawdown:0;
  const took=b.taken.slice(0,3).map(t=>`<span class="why took"><em>On risk</em>${nice(t.name)} · ${t.linePercent.toFixed(0)}% · score ${t.score.toFixed(2)}</span>`).join("");
  const refused=b.refused.filter(t=>t.score>0).slice(0,2).map(t=>{
    const why=t.caps&&t.caps[0]?t.caps[0]:"off-risk this term";
    return `<span class="why refused"><em>Refused</em>${nice(t.name)} · ${why}</span>`;
  }).join("");
  const src=b.source==="rule"
    ? "Memo written from the allocator’s numbers. The rule chooses the line; the prose does not."
    : "Memo drafted by grok-4.5 from the allocator’s numbers. The rule still chooses the line.";
  return `
  <section class="hero"><div class="wrap">
    <div class="decision">
      <p class="eyebrow">This epoch · ${b.epoch!=null?b.epoch:v.epoch}</p>
      <h3>${esc(b.headline)}</h3>
      <p class="memo">${esc(b.body)}</p>
      <div class="whys">${took}${refused}</div>
      <p class="source">${src}</p>
    </div>

    <dl class="stats">
      <div class="stat"><dt>Net asset value</dt>
        <dd>${fmt(v.nav)}</dd><div class="sub">USDC · ${fmt(v.deployed)} deployed</div></div>
      <div class="stat"><dt>Return on seed</dt>
        <dd class="${v.totalReturn>=0?"pos":"neg"}">${v.totalReturn>=0?"+":""}${pct(v.totalReturn)}</dd>
        <div class="sub">over ${Math.floor(v.epoch/4)} simulated years</div></div>
      <div class="stat"><dt>Predicted vs realised</dt>
        <dd>${(pred/100).toFixed(1)} / ${(real/100).toFixed(1)}%</dd>
        <div class="sub">event quarters · ${evQ.length} scored</div></div>
      <div class="stat"><dt>Max drawdown</dt>
        <dd class="neg">${pct(dd)}</dd>
        <div class="sub">peak to trough on the live run</div></div>
    </dl>

    <div class="actions">
      <button class="act" id="verifyBtn" type="button">Verify everything</button>
      <button class="ghost" id="stressBtn" type="button">Stress-test this book</button>
    </div>
    <div class="panel-run" id="verifyPanel" hidden></div>
    <div class="panel-run" id="stressPanel" hidden></div>
  </div></section>`;
}

function mountVerify(d){
  const checks=(d.verify&&d.verify.checks)||[];
  const panel=$("#verifyPanel");
  if(!panel||!checks.length) return;
  panel.hidden=false;
  panel.innerHTML=`<h3>Verify this run</h3>
    <p class="note" style="color:var(--muted);font-size:11.5px;margin:0 0 12px">
      Four checks can be run while the seed is sealed. The fifth is the point
      of sealing it.</p>
    <div id="checkList"></div>`;
  const list=$("#checkList");
  checks.forEach((c,i)=>{
    setTimeout(()=>{
      const mark=c.ok===true?"pass":c.ok===false?"fail":"sealed";
      const label=c.ok===true?"Pass":c.ok===false?"Fail":"Sealed";
      const row=document.createElement("div");
      row.className="check";
      row.innerHTML=`<span class="mark ${mark}">${label}</span>
        <div><p>${esc(c.label)}</p><div class="detail">${esc(c.detail)}</div></div>`;
      list.appendChild(row);
    }, 280*i);
  });
}

  ).join("");
  panel.innerHTML=`<h3>Stress-test of the standing book</h3>

function bindHero(d){
  const vbtn=$("#verifyBtn"), sbtn=$("#stressBtn");
  const vpanel=$("#verifyPanel"), spanel=$("#stressPanel");
  if(vbtn) vbtn.onclick=()=>{
    if(!vpanel.hidden){ vpanel.hidden=true; vpanel.innerHTML=""; return; }
    mountVerify(d);
  };
  if(sbtn) sbtn.onclick=()=>{
    if(!spanel.hidden){ spanel.hidden=true; spanel.innerHTML=""; return; }
    mountStress(d);
  };
  if(location.search.includes("demo=1")){
    setTimeout(()=>vbtn&&vbtn.click(), 900);
    setTimeout(()=>sbtn&&sbtn.click(), 2800);
  }
}

  <section><div class="wrap">
    <p class="eyebrow">Next</p>
    <h2>The path off testnet</h2>
    <p class="lede">Anyone can fork the scoring rule. They cannot retroactively un-commit
      the risk process. That is the moat: on-chain catastrophe and insurance
      risk capital that can be audited, not believed.</p>
    <div class="roadmap">
      <div class="step-card now"><span class="num">Now</span>
        <h3>Testnet simulation</h3>
        <p>Committed seed, frozen parameters, agent on nine layers, forecasts written before settlement.</p></div>
      <div class="step-card"><span class="num">Next</span>
        <h3>Parametric oracle</h3>
        <p>Swap EventOracle for NOAA wind / USGS magnitude. The vault and settlement do not change.</p></div>
      <div class="step-card"><span class="num">Then</span>
        <h3>Real cedent</h3>
        <p>A captive, MGA or parametric buyer replaces SimCedent. Terms become quoted, not calibrated.</p></div>
      <div class="step-card"><span class="num">After</span>
        <h3>Regulated vehicle</h3>
        <p>Counsel, licensing, real capital. The contracts are ready; the licence is not a module swap.</p></div>
    </div>
  </div></section>`;
  bindHero(d);
}

fetch("data.json?"+Date.now())
  .then(r=>{if(!r.ok)throw new Error("data.json not found. Run: python3 indexer.py");return r.json()})
  .then(render)
  .catch(e=>{$("#boot").textContent=e.message});

const enterBtn=document.querySelector(".enter-btn");
const enterMenu=document.querySelector(".enter-menu");
if(enterBtn&&enterMenu){
  enterBtn.addEventListener("click",e=>{
    e.stopPropagation();
    const open=enterMenu.hidden;
    enterMenu.hidden=!open;
    enterBtn.setAttribute("aria-expanded", open?"true":"false");
  });
  document.addEventListener("click",()=>{
    enterMenu.hidden=true;
    enterBtn.setAttribute("aria-expanded","false");
  });
}
</script>
</body>
